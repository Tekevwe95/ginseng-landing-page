<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ginseng Plus Admin</title><link rel="stylesheet" href="style.css"></head><body><header><div><strong>GINSENG+</strong><span> Order Dashboard</span></div><button id="logout">Logout</button></header><main><section class="stats"><div><small>New</small><strong id="newCount">0</strong></div><div><small>Confirmed</small><strong id="confirmedCount">0</strong></div><div><small>Out for delivery</small><strong id="deliveryCount">0</strong></div><div><small>Delivered</small><strong id="deliveredCount">0</strong></div></section><section class="toolbar"><h1>Orders</h1><button id="refresh">Refresh</button></section><div id="login" class="card"><h2>Admin access</h2><p>Enter your admin token.</p><input id="token" type="password" placeholder="Admin token"><button id="loginBtn">Sign in</button><p id="loginMessage"></p></div><section id="orders" class="card hidden"><div id="orderList"></div></section></main><script src="script.js"></script></body></html>
