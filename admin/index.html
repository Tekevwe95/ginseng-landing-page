<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Megastore Wellness | Admin Dashboard</title><link rel="stylesheet" href="/admin/style.css?v=8"></head><body><header><div><strong>MEGASTORE WELLNESS</strong><span> Order Dashboard</span></div><div id="adminActions" class="header-actions hidden"><button id="notifications" type="button">🔔 Enable notifications</button><button id="testNotification" type="button" class="hidden">🧪 Test notification</button><button id="logout" type="button">Logout</button></div></header><main><section id="stats" class="stats hidden"><div><small>New</small><strong id="newCount">0</strong></div><div><small>Confirmed</small><strong id="confirmedCount">0</strong></div><div><small>Out for delivery</small><strong id="deliveryCount">0</strong></div><div><small>Delivered</small><strong id="deliveredCount">0</strong></div></section><section id="dashboardToolbar" class="toolbar hidden"><h1>Orders</h1><button id="refresh" type="button">Refresh</button></section><div id="login" class="card"><h2>Admin access</h2><p>Enter your admin token.</p><input id="token" type="password" placeholder="Admin token" autocomplete="current-password"><button id="loginBtn" type="button">Sign in</button><p id="loginMessage" aria-live="polite"></p></div><section id="orders" class="card hidden"><div class="order-tools"><input id="search" type="search" placeholder="Search order ID, name, phone or city"><select id="statusFilter"><option value="all">All statuses</option><option value="new">New</option><option value="confirmed">Confirmed</option><option value="out_for_delivery">Out for delivery</option><option value="delivered">Delivered</option><option value="cancelled">Cancelled</option></select></div><div id="orderList"></div></section></main><script src="/admin/script.js?v=8" defer></script><script src="/admin/notifications.js?v=10" defer></script><script>
(function(){
  function sync(){
    var signedIn=!!localStorage.getItem('ginseng_admin_token');
    ['adminActions','stats','dashboardToolbar','orders'].forEach(function(id){var el=document.getElementById(id);if(el)el.classList.toggle('hidden',!signedIn);});
    var login=document.getElementById('login');if(login)login.classList.toggle('hidden',signedIn);
  }
  sync();
  setInterval(sync,250);
})();
</script></body></html>
