<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Megastore Wellness | Admin Dashboard</title><link rel="stylesheet" href="/admin/style.css?v=2"></head><body><header><div><strong>MEGASTORE WELLNESS</strong><span> Order Dashboard</span></div><button id="logout">Logout</button></header><main><section class="stats"><div><small>New</small><strong id="newCount">0</strong></div><div><small>Confirmed</small><strong id="confirmedCount">0</strong></div><div><small>Out for delivery</small><strong id="deliveryCount">0</strong></div><div><small>Delivered</small><strong id="deliveredCount">0</strong></div></section><section class="toolbar"><h1>Orders</h1><button id="refresh">Refresh</button></section><div id="login" class="card"><h2>Admin access</h2><p>Enter your admin token.</p><input id="token" type="password" placeholder="Admin token" autocomplete="current-password"><button id="loginBtn">Sign in</button><p id="loginMessage" aria-live="polite"></p></div><section id="orders" class="card hidden"><div id="orderList"></div></section></main><script src="/admin/script.js?v=2" defer></script></body></html>
